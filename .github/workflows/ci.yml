name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: buf lint / breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"

  gen-drift:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile   # provides protoc-gen-es (local buf plugin)
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'
      - run: make gen
      - name: check drift
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
          git diff --exit-code

  go:
    name: go vet / test / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: apps/server
          args: --config ../../.golangci.yml --build-tags integration

  go-integration:
    name: go integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: calaba
          POSTGRES_PASSWORD: calaba
          POSTGRES_DB: calaba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calaba" --health-interval 2s --health-timeout 2s --health-retries 20
      redis:
        image: redis:7.4-alpine   # >= 7.4 required (HEXPIRE)
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/server/go.sum
      - name: start LiveKit (dev mode; services cannot pass --dev)
        run: |
          docker run -d --name livekit -p 7880:7880 -p 7881:7881 -p 7882:7882/udp \
            livekit/livekit-server:v1.13 --dev --bind 0.0.0.0
          for i in $(seq 1 30); do curl -sf http://localhost:7880 >/dev/null && break; sleep 1; done
      - run: go test -race -tags integration -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://calaba:calaba@localhost:5432/calaba
          TEST_REDIS_URL: redis://localhost:6379/15

  ts:
    name: pnpm typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
