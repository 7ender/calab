# Desktop releases of Calab (github.com/itrcz/calab) on native runners (docs/06, "Релизы десктопа: сборка").
#
#   - tag push `v1.2.3`        → build all three OSes with version 1.2.3, create a GitHub Release,
#                                 publish to <domain>/download/ if the stand secrets are configured
#   - workflow_dispatch         → same; version from the input (or apps/desktop/package.json), Release is a draft
#
# Unlike apps/desktop/scripts/build-release.sh (one Mac + an x86_64 Docker host), every OS builds natively
# here, so the patched uiohook-napi is compiled from source everywhere — including Windows (MSVC on the
# runner). electron-builder.yml's strict policy (upstream prebuilds excluded, buildDependenciesFromSource)
# therefore needs no Windows override in CI.
#
# Secrets for publishing to the stand (all optional; without them the publish job is skipped):
#   STAND_SSH_KEY     private key of a deploy user allowed to write /opt/calaba/releases (not root, ideally
#                     with a forced rsync command / restricted to that directory)
#   STAND_HOST        user@host, e.g. deploy@141.105.69.177
#   STAND_KNOWN_HOSTS output of `ssh-keyscan -t ed25519 <host>` (pinned host key, no TOFU)
# Signing (stage 4, not configured): macOS CSC_LINK/CSC_KEY_PASSWORD + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
# APPLE_TEAM_ID; Windows cloud signing (Azure Trusted Signing / eSigner) — see docs/06.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0). Empty = apps/desktop/package.json'
        required: false
        default: ''
      publish_stand:
        description: 'Publish to <domain>/download/ (needs STAND_* secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPO: itrcz/calab                      # git@github.com:itrcz/calab.git
  UPDATE_URL: https://app.calab.ru/download/     # docs/10-branding.md
  HOMEPAGE: https://calab.ru

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac        # arm64 runner; x64 is cross-compiled (arch list comes from electron-builder.yml)
            os: macos-latest
            eb: --mac
          - target: linux
            os: ubuntu-22.04
            eb: --linux AppImage deb --x64
          - target: win
            os: windows-latest
            eb: --win nsis --x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: X11 headers for uiohook (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev

      - name: version
        id: ver
        run: |
          v="${{ inputs.version }}"
          if [[ -z "$v" && "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [[ -n "$v" ]]; then (cd apps/desktop && npm version "$v" --no-git-tag-version --allow-same-version); fi
          echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # postinstall compiles the patched uiohook-napi for the runner (electron-rebuild); electron-builder
      # compiles it again per target arch (buildDependenciesFromSource).
      - run: pnpm install --frozen-lockfile
      - name: uiohook patch applied
        run: grep -q VC_CAPS_LOCK_STATE node_modules/uiohook-napi/libuiohook/include/uiohook.h
      - run: pnpm -F @calaba/desktop exec electron-vite build

      - name: electron-builder
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned until stage 4
        run: |
          rm -rf ../../node_modules/uiohook-napi/bin   # postinstall copy for the runner arch only
          pnpm exec electron-builder ${{ matrix.eb }} --publish never \
            -c.publish.provider=generic "-c.publish.url=$UPDATE_URL" \
            '-c.mac.artifactName=Calab-${version}-${arch}.${ext}' \
            '-c.nsis.artifactName=Calab-Setup-${version}-${arch}.${ext}' \
            '-c.appImage.artifactName=Calab-${version}-${arch}.${ext}' \
            '-c.deb.artifactName=calab_${version}_${arch}.${ext}' \
            -c.linux.executableName=calab -c.deb.packageName=calab \
            "-c.extraMetadata.homepage=$HOMEPAGE" \
            -c.directories.output=dist-release

      - name: native module is packaged (a missing one crashes main at startup)
        working-directory: apps/desktop/dist-release
        run: |
          found=$(find . -path '*uiohook*' -name '*.node' | grep -v prebuilds || true)
          echo "$found"
          test -n "$found"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/dist-release/*.dmg
            apps/desktop/dist-release/*.zip
            apps/desktop/dist-release/*.AppImage
            apps/desktop/dist-release/*.deb
            apps/desktop/dist-release/*.exe
            apps/desktop/dist-release/*.blockmap
            apps/desktop/dist-release/latest*.yml

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release
      - name: create GitHub Release (gh CLI, no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist-release
          ver=$(sed -n 's/^version: //p' dist-release/latest-linux.yml)
          tag="${GITHUB_REF_NAME}"; draft=""
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then tag="v$ver"; draft="--draft"; fi
          gh release create "$tag" $draft --repo "$RELEASE_REPO" --target "$GITHUB_SHA" \
            --title "Calab $ver" --notes "Unsigned test build. Installers and update feeds (latest*.yml)." \
            dist-release/*

  publish-stand:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_stand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release
      - name: publish to /download/ (skipped without STAND_* secrets)
        env:
          STAND_SSH_KEY: ${{ secrets.STAND_SSH_KEY }}
          STAND_HOST: ${{ secrets.STAND_HOST }}
          STAND_KNOWN_HOSTS: ${{ secrets.STAND_KNOWN_HOSTS }}
        run: |
          if [[ -z "$STAND_SSH_KEY" || -z "$STAND_HOST" || -z "$STAND_KNOWN_HOSTS" ]]; then
            echo "::notice::STAND_* secrets not configured — publishing skipped"; exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAND_SSH_KEY" > ~/.ssh/id_stand && chmod 600 ~/.ssh/id_stand
          printf '%s\n' "$STAND_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Same semantics as infra/docker/sync.sh: installers first, latest*.yml together at the end
          # (--delay-updates), never --delete (old versions stay downloadable; /download/ caches them as immutable).
          rsync -az --delay-updates -e "ssh -i ~/.ssh/id_stand -o StrictHostKeyChecking=yes" \
            dist-release/ "$STAND_HOST:/opt/calaba/releases/"
