syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";

// Public profile, visible to members of shared workspaces.
message User {
  string id = 1;
  string display_name = 2;
  string avatar_file_id = 3; // empty = no avatar
  string status_text = 4;
  google.protobuf.Timestamp created_at = 5;
  string status_emoji = 6;
  google.protobuf.Timestamp status_expires_at = 7; // unset = no expiry; expired status is returned empty
  bool is_guest = 8; // guest account from a room link (ADR-0016): show a "Guest" badge
}

enum MicMode {
  MIC_MODE_UNSPECIFIED = 0; // treated as VAD
  MIC_MODE_VAD = 1;         // voice activation (default)
  MIC_MODE_PUSH_TO_TALK = 2;
}

// Per-user settings synced across the user's devices (USER_UPDATE on change).
// Device-specific things (selected mic/speaker, PTT key hook state) stay local on the client.
// The server always returns every field explicitly, with defaults for new users
// (noise_suppression = true, mic_mode = VAD, audio_bitrate_kbps unset = room setting), so a
// zero value is a real choice, never "missing". PATCH /api/me replaces all settings: send
// the full message.
message UserSettings {
  bool noise_suppression = 1;    // RNNoise worklet on/off (docs/02-media.md); default true
  bool unstable_network_red = 2; // opt-in Opus RED (ADR-0004); default false
  bool push_to_talk = 3 [deprecated = true]; // use mic_mode; kept in sync by the server
  string push_to_talk_key = 4;   // accelerator string, client-defined format
  MicMode mic_mode = 5;          // default VAD
  optional uint32 audio_bitrate_kbps = 6; // personal cap for published voice; unset = room setting
}

// The authenticated user: public profile + private fields.
message Me {
  User user = 1;
  string email = 2;
  UserSettings settings = 3;
}

// GET /api/me
message GetMeResponse {
  Me me = 1;
}

// PATCH /api/me. Unset fields are left unchanged; `settings`, when present, replaces all settings.
message UpdateMeRequest {
  optional string display_name = 1;
  optional string status_text = 2;
  optional string avatar_file_id = 3; // "" clears the avatar
  optional UserSettings settings = 4;
}

message UpdateMeResponse {
  Me me = 1;
}

// PATCH /api/me/password → 204. The current password is required; every other session of
// the user is revoked (this one stays). 403 INVALID_CREDENTIALS: wrong current password;
// 403 FORBIDDEN: guest account. Password attempts share a 5 / 15 min bucket per account.
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2; // 8..256 characters
}

// PATCH /api/me/email → UpdateMeResponse (+ USER_UPDATE {me} to the user's devices). No
// confirmation mail (the server sends no email). 409 CONFLICT: address taken; 403 as above.
message ChangeEmailRequest {
  string new_email = 1;
  string current_password = 2;
}

// PATCH /api/me/status — custom status. Empty text and emoji clear it. Announced to the
// user's workspaces as PRESENCE_UPDATE (+ USER_UPDATE). Response: UpdateMeResponse.
message UpdateStatusRequest {
  string text = 1;  // ≤ 128 chars
  string emoji = 2; // one emoji sequence, ≤ 32 bytes
  uint32 expires_in_seconds = 3; // 0 = never, ≤ 30 days
}
