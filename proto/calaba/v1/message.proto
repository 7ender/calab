syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/file.proto";
import "calaba/v1/recording.proto";
import "calaba/v1/sticker.proto";

message Message {
  string id = 1; // uuidv7 generated by Postgres: order of ids = order of commits
  string room_id = 2;
  string author_id = 3;
  string content = 4; // ≤ 4000 chars
  repeated FileMeta attachments = 5; // ≤ 20, in order
  string reply_to_id = 6;
  string nonce = 7; // client id of the optimistic message, echoed back
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp edited_at = 9;
  // Aggregated reactions in order of first use. `me` is relative to the requesting user and
  // is filled only in REST responses; in events (MESSAGE_UPDATE) counts are current but `me`
  // is always false — clients keep their own `me` and apply MESSAGE_REACTION_ADD/REMOVE.
  repeated Reaction reactions = 10;
  google.protobuf.Timestamp pinned_at = 11; // unset = not pinned
  string pinned_by = 12;
  // Link previews (unfurl) of this message are hidden: clients do not render them.
  bool embeds_hidden = 13;
  // SYSTEM: a message posted by the server about an event (ADR-0025), rendered from `system`
  // instead of `content` (empty); author_id is the user the event is about. It cannot be
  // edited; it can be deleted (MANAGE_MESSAGES or the author), reacted to and pinned.
  MessageKind kind = 14;
  SystemMessage system = 15; // set for kind SYSTEM
  // A sticker message (ADR-0030): empty content, no attachments, cannot be edited. Unset
  // with an empty content and no attachments = the sticker is gone (its workspace was
  // deleted); clients show a placeholder.
  Sticker sticker = 16;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0; // a user's message
  MESSAGE_KIND_SYSTEM = 1;
}

// Payload of a system message. Clients that do not know the case show nothing for it.
message SystemMessage {
  oneof payload {
    RecordingCard recording = 1; // a meeting recording (ADR-0025)
  }
}

message Reaction {
  string emoji = 1; // Unicode emoji sequence
  uint32 count = 2;
  bool me = 3;
}

// GET /api/workspaces/{id}/messages/search?q=&room_id=&author_id=&before=&limit= and
// GET /api/rooms/{id}/messages?q=: full-text search (newest first, cursor `before`,
// limit ≤ 50) over rooms the caller can view. The response is ListMessagesResponse.

// GET /api/rooms/{id}/pins (VIEW_ROOM): pinned messages, most recently pinned first
// (≤ 50 per room). The response is ListMessagesResponse.

// GET /api/rooms/{id}/messages?before=&after=&limit= (VIEW_ROOM). Newest first for `before`.
// Also the response of GET /api/me/mentions?before=&limit=&workspace_id= : messages that
// mention the caller (@<user_id>, @everyone, @here) in rooms the caller can view, newest first.
message ListMessagesResponse {
  repeated Message messages = 1;
  bool has_more = 2;
}

// POST /api/rooms/{id}/messages (SEND_MESSAGES; ATTACH_FILES if attachments).
// Idempotent by (author, nonce): a retry returns the existing message with 200 instead of 201.
message CreateMessageRequest {
  string content = 1;
  repeated string attachment_ids = 2;
  string reply_to_id = 3;
  string nonce = 4; // ≤ 64 chars
  // Send a sticker (ADR-0030) instead of text: content and attachments must be empty. The
  // sticker's pack must be usable here: a room of its workspace, or a DM whose participants
  // are both non-guest members of it; the sender must not be a guest there.
  string sticker_id = 5;
}

message CreateMessageResponse {
  Message message = 1;
}

// PATCH /api/messages/{id} (author only; not a sticker message)
message UpdateMessageRequest {
  string content = 1;
}

message UpdateMessageResponse {
  Message message = 1;
}

// PUT /api/messages/{id}/embeds-hidden (author, or MANAGE_MESSAGES) → UpdateMessageResponse;
// MESSAGE_UPDATE to the room. Does not mark the message edited.
message SetEmbedsHiddenRequest {
  bool hidden = 1;
}

// PUT /api/rooms/{id}/read (VIEW_ROOM). Moves the read marker forward only; 204.
message UpdateReadStateRequest {
  string message_id = 1;
}
