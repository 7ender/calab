syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/user.proto";

// A login session = one device. Each session has its own rotating refresh token.
message Session {
  string id = 1;
  string device_name = 2;
  string ip = 3;
  string user_agent = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool current = 8; // true for the session that made the request
}

// Token pair returned by register / login / refresh.
message AuthTokens {
  string access_token = 1; // JWT HS256, `Authorization: Bearer <token>`
  google.protobuf.Timestamp access_expires_at = 2;
  string refresh_token = 3; // opaque, single use (rotated on every refresh)
  google.protobuf.Timestamp refresh_expires_at = 4;
  string session_id = 5;
}

// POST /api/auth/register
message RegisterRequest {
  string email = 1;
  string password = 2; // 8..256 chars
  string display_name = 3;
  // Required when REGISTRATION_MODE=invite: a valid workspace invite code — a link's code or
  // the code of an invitation sent by email. A link's code: the new user joins that workspace
  // at once. An emailed code works only with the invited address (else 403
  // INVITE_EMAIL_MISMATCH); the user joins after confirming the address (POST /api/auth/verify).
  string invite_code = 4;
  string device_name = 5;
  // Language of emails (BCP 47, e.g. "ru-RU"); empty = from Accept-Language, else English.
  // Registration sends a verification code to `email` (ADR-0023, ADR-0027).
  string locale = 6;
}

message RegisterResponse {
  AuthTokens tokens = 1;
  Me me = 2;
}

// POST /api/auth/login
message LoginRequest {
  string email = 1;
  string password = 2;
  string device_name = 3;
}

message LoginResponse {
  AuthTokens tokens = 1;
  Me me = 2;
}

// POST /api/auth/refresh (no access token needed).
// Presenting an already rotated refresh token revokes the whole session (reuse detection).
// Web clients (X-Client: web) leave refresh_token empty: it comes from the calaba_refresh
// cookie, and the rotated token is set as a cookie instead of being returned in the body.
message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  AuthTokens tokens = 1;
}

// POST /api/auth/logout. Identifies the session by the access token (Authorization) or,
// without one, by the refresh token: this field, else the calaba_refresh cookie (web).
// Revokes that session, or every session of the user when all_sessions is set.
message LogoutRequest {
  bool all_sessions = 1;
  string refresh_token = 2;
}

// GET /api/me/sessions
message ListSessionsResponse {
  repeated Session sessions = 1;
}

// ---- Email verification and password reset (ADR-0023) ----
// Codes: 6 digits, valid 10 minutes, 5 attempts, a new one at most every 60 s; at most 3
// mails per address per hour (429 with Retry-After).
//
// POST /api/auth/verify/send (access token) → 204: (re)sends the code to the pending new
// address, else to the account email. Signing in (login) while unverified also sends one
// if the last is older than 60 s. 409 CONFLICT: already verified and no pending change;
// 403: guest. Servers without SMTP mark the address verified instead (USER_UPDATE {me}).
//
// POST /api/auth/verify (access token) → VerifyEmailResponse (+ USER_UPDATE {me}): confirms
// the email (or the pending change). Afterwards pending email invitations of the address are
// accepted automatically (WORKSPACE_CREATE per workspace). 422 CODE_INVALID: wrong code;
// 422 CODE_EXPIRED: no active code (expired / 5 attempts used) — send a new one.
message VerifyEmailRequest {
  string code = 1;
}

message VerifyEmailResponse {
  Me me = 1;
  // Workspaces joined by this verification (pending email invitations of the address); the
  // same WORKSPACE_CREATE events also arrive over the gateway. Empty = none.
  repeated string joined_workspace_ids = 2;
}

// POST /api/auth/password/forgot (no auth) → always 204, whether or not the address has an
// account: if it has, a reset code is mailed to it. 503: the server has no SMTP.
message ForgotPasswordRequest {
  string email = 1;
}

// POST /api/auth/password/reset (no auth) → 204. Sets the new password, marks the email
// verified and revokes every session of the account (sign in again). 422 CODE_INVALID for a
// wrong / expired code or an unknown address (indistinguishable on purpose); 422 VALIDATION
// (field "password"): 8..256 characters.
message ResetPasswordRequest {
  string email = 1;
  string code = 2;
  string password = 3;
}
