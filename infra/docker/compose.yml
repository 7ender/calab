# Production-like stack on a single host. Secrets live in infra/docker/.env (see .env.example).
# Deploy with ./deploy.sh (renders livekit/livekit.gen.yaml, then `docker compose up`).
# caddy, livekit and api use host network: WebRTC/TURN need direct ports, and the API
# talks to everything over 127.0.0.1. postgres/valkey publish only on 127.0.0.1.
# Files: local volume files_data via the API's fs driver (ADR-0011), no S3 service.

# Baseline for every service we run (security review L6): no new privileges, no capabilities
# unless listed, read-only root filesystem with tmpfs for scratch space.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# Explicit project name: volumes/containers are calaba_*, and --remove-orphans
# never touches other compose projects on a shared host.
name: calaba

services:
  caddy:
    build: ./caddy
    network_mode: host
    restart: unless-stopped
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]    # 80/443 as root without other capabilities
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { memory: 512m }
    command: caddy run --config /etc/caddy/Caddyfile
    environment:
      # docs/10-branding.md: rtc./turn.<DOMAIN>; the app on APP_HOST (default DOMAIN); optional landing
      - DOMAIN=${DOMAIN}
      - APP_HOST=${APP_HOST:-}
      - LANDING_HOST=${LANDING_HOST:-}
      - DOMAIN_ALT=${DOMAIN_ALT:-}          # extra app host (alias), optional
      - DOMAIN_LEGACY=${DOMAIN_LEGACY:-}    # extra app host (transitional), optional
      # desktop release feed: unset → releases.<DOMAIN>; set to empty → none (/download/ served locally)
      - RELEASES_HOST=${RELEASES_HOST-releases.${DOMAIN}}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-}   # public-read bucket (path-style); empty → /srv/releases
      - S3_BUCKET=${S3_BUCKET:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ../../web:/srv/web:ro              # <repo root on host>/web = web client static (sync.sh: apps/desktop/dist-web or placeholder)
      - ../../releases:/srv/releases:ro    # <repo root on host>/releases = /download/* (sync.sh: apps/desktop/dist-release)
      - ../../landing:/srv/landing:ro      # <repo root on host>/landing = LANDING_HOST static (sync.sh: apps/landing/out)
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.gen.yaml:/etc/livekit.yaml:ro   # rendered by deploy.sh
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    deploy:
      resources:
        limits: { memory: 4g }
    logging: *logging

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      args:
        # Stamped into GET /api/version. The host tree has no .git (sync.sh excludes it),
        # so the caller passes them: CALABA_COMMIT=$(git rev-parse --short HEAD).
        VERSION: ${CALABA_VERSION:-dev}
        COMMIT: ${CALABA_COMMIT:-unknown}
    network_mode: host
    restart: unless-stopped
    environment:
      - HTTP_ADDR=127.0.0.1:3000
      - PUBLIC_APP_URL=https://${APP_HOST:-${DOMAIN}}
      - PUBLIC_APP_URL_ALT=${DOMAIN_ALT:+https://${DOMAIN_ALT}}   # empty when no alias host
      # every browser origin of the web client (server: PUBLIC_APP_URLS, comma-separated); empty parts skipped
      - PUBLIC_APP_URLS=https://${APP_HOST:-${DOMAIN}}${DOMAIN_ALT:+,https://${DOMAIN_ALT}}${DOMAIN_LEGACY:+,https://${DOMAIN_LEGACY}}
      - DATABASE_URL=postgres://calaba:${POSTGRES_PASSWORD}@127.0.0.1:5432/calaba
      - REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379
      - JWT_SECRET=${JWT_SECRET}
      - LIVEKIT_URL=wss://rtc.${DOMAIN}
      - LIVEKIT_INTERNAL_URL=http://127.0.0.1:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - STORAGE_DRIVER=fs
      - STORAGE_PATH=/data/files
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - STORAGE_MAX_TOTAL_BYTES=${STORAGE_MAX_TOTAL_BYTES:-53687091200}   # 50 GiB for all uploads (shared host disk)
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite}
    <<: *hardening                 # distroless nonroot (65532); writes only to /data/files
    tmpfs: [/tmp]
    volumes:
      - files_data:/data/files
    deploy:
      resources:
        limits: { memory: 1g }
    healthcheck:   # distroless has no curl: the binary probes its own /readyz (postgres + valkey)
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    logging: *logging

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873   # PG 18: built-in uuidv7()
    restart: unless-stopped
    <<: *hardening
    user: "70:70"                  # run as postgres directly: no gosu, no capabilities needed
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=2775
    environment:
      - POSTGRES_USER=calaba
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=calaba
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql   # PG 18 images keep PGDATA in a versioned subdir here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calaba"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 2g }
    logging: *logging

  # Valkey (BSD-3-Clause, Redis-compatible) instead of Redis 7.4+ (RSAL/SSPL). ≥ 9.0: hash
  # field TTL (HEXPIRE) for presence; the API checks the version at startup. Clients still
  # speak the Redis protocol (REDIS_URL, rueidis).
  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    <<: *hardening
    user: "999:1000"               # valkey
    tmpfs: [/tmp]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # Password goes into a tmpfs config file, not argv (visible in `ps` on the shared host).
    # noeviction: sessions, revocations and gateway buffers must never be silently dropped.
    command:
      - sh
      - -c
      - |
        umask 077
        pw=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')   # escape \ and " for the config
        printf 'requirepass "%s"\n' "$$pw" > /tmp/auth.conf
        exec valkey-server /tmp/auth.conf --save 60 1 --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      # New volume: Valkey does not read Redis 7.4 persistence files (RDB 12). Only transient
      # state lives here (revocation markers, limits, voice, presence, gateway buffers).
      - valkey_data:/data
    deploy:
      resources:
        limits: { memory: 768m }
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  valkey_data:
  files_data:   # uploaded files (API fs driver); back up offsite, see docs/06
