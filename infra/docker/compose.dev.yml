# Локальная разработка (macOS): БД, Valkey (совместим с Redis), LiveKit в dev-режиме без TLS.
# Файлы API пишет на локальный диск (STORAGE_DRIVER=fs, ADR-0011) — сервиса S3 нет.
# API и Electron запускаются на хосте через pnpm.
# Примечание: Docker на macOS не даёт host network → LiveKit в контейнере годится только
# для клиентов на этой же машине. Для тестов между машинами в LAN: `brew install livekit`
# и `livekit-server --dev --bind 0.0.0.0`.

# Explicit project name: volumes/containers are calaba_*, and --remove-orphans
# never touches other compose projects on a shared host.
name: calaba-dev

services:
  postgres:
    image: postgres:18-alpine   # PG 18: built-in uuidv7()
    environment:
      - POSTGRES_USER=calaba
      - POSTGRES_PASSWORD=calaba
      - POSTGRES_DB=calaba
    ports: ["55432:5432"]   # 5432 is often taken by other local projects
    volumes: [pg_dev:/var/lib/postgresql]

  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11   # ≥ 9.0: HEXPIRE for presence
    ports: ["56379:6379"]   # 6379 is often taken by a native Redis

  livekit:
    image: livekit/livekit-server:v1.13
    # livekit.dev.yaml: ключи devkey / secret, UDP mux 7882, webhook → API на хосте (:3000)
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop resolves it natively
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pg_dev:
