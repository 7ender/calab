# ==============================================================
# Calab on Dokploy
#
# Current main-compatible deployment.
#
# Traefik (Dokploy):
#   - terminates TLS
#   - HTTP -> HTTPS redirect
#   - app/API routing
#   - LiveKit WebSocket routing
#   - TURN/TLS routing by SNI
#
# nginx:
#   - app SPA
#   - landing static export
#   - /download/*
#   - local release files
#   - optional S3 release proxy
#
# Docker bridge:
#   api <-> postgres
#   api <-> valkey
#   api <-> livekit
#   livekit <-> valkey
#   egress <-> livekit/valkey
#   sip <-> livekit/valkey
#
# Dokploy:
#   Compose Path:
#     ./infra/dokploy/compose.yml
#
# Required external network:
#   dokploy-network
#
# Environment:
#   configure in Dokploy Environment tab.
# ==============================================================

version: "3.8"


# ==============================================================
# SECURITY
# ==============================================================

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true


x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"


services:

  # ============================================================
  # WEB
  #
  # nginx serves:
  #   - SPA
  #   - landing
  #   - /download/*
  #   - releases
  #
  # Traefik terminates TLS.
  # ============================================================

  web:
    build:
      context: ../..
      dockerfile: infra/dokploy/web/Dockerfile

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    environment:
      DOMAIN: "${DOMAIN:?}"

      # Main application host.
      # Empty means DOMAIN.
      APP_HOST: "${APP_HOST:-${DOMAIN}}"

      # Optional additional application hosts.
      # Empty is intentionally allowed.
      DOMAIN_ALT: "${DOMAIN_ALT:-}"
      DOMAIN_LEGACY: "${DOMAIN_LEGACY:-}"

      # Optional landing host.
      #
      # Empty means there is no dedicated landing host.
      LANDING_HOST: "${LANDING_HOST:-}"

      # RELEASES_HOST:
      #   unset  -> releases.<DOMAIN>
      #   empty  -> no release host
      #
      # We preserve the distinction between "unset" and "empty".
      RELEASES_HOST_EFFECTIVE: "${RELEASES_HOST-releases.${DOMAIN}}"

      # Public S3-compatible release bucket.
      #
      # Empty:
      #   serve /srv/releases locally.
      #
      # Set:
      #   release host proxies the bucket.
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"

    volumes:
      # Local release artifacts.
      #
      # This is intentionally separate from the application build.
      # When S3_PUBLIC_URL is set, this volume is not used for downloads.
      - releases_data:/srv/releases

    deploy:
      resources:
        limits:
          memory: 256m

    networks:
      - dokploy-network

    logging: *logging

    labels:

      traefik.enable: "true"
      traefik.docker.network: "dokploy-network"

      # --------------------------------------------------------
      # HTTP -> HTTPS
      #
      # Include every hostname that can be served by nginx.
      # Optional empty hosts resolve to disabled.invalid so the
      # generated Traefik rule remains syntactically valid.
      # --------------------------------------------------------

      traefik.http.routers.calab-http.rule: >-
        Host(
          `${DOMAIN}`,
          `${APP_HOST:-${DOMAIN}}`,
          `${DOMAIN_ALT:-${DOMAIN}}`,
          `${DOMAIN_LEGACY:-${DOMAIN}}`,
          `${LANDING_HOST:-${DOMAIN}}`,
          `${RELEASES_HOST_EFFECTIVE:-disabled.invalid}`
        )

      traefik.http.routers.calab-http.entrypoints: "web"
      traefik.http.routers.calab-http.middlewares: "redirect-to-https@file"


      # --------------------------------------------------------
      # HTTPS -> nginx
      # --------------------------------------------------------

      traefik.http.routers.calab-web.rule: >-
        Host(
          `${DOMAIN}`,
          `${APP_HOST:-${DOMAIN}}`,
          `${DOMAIN_ALT:-${DOMAIN}}`,
          `${DOMAIN_LEGACY:-${DOMAIN}}`,
          `${LANDING_HOST:-${DOMAIN}}`,
          `${RELEASES_HOST_EFFECTIVE:-disabled.invalid}`
        )

      traefik.http.routers.calab-web.entrypoints: "websecure"
      traefik.http.routers.calab-web.tls: "true"
      traefik.http.routers.calab-web.tls.certresolver: "letsencrypt"
      traefik.http.routers.calab-web.middlewares: "crowdsec@file"
      traefik.http.routers.calab-web.service: "calab-web"

      traefik.http.services.calab-web.loadbalancer.server.port: "80"


  # ============================================================
  # API
  #
  # Public:
  #   /api/*
  #   /gateway
  #   /healthz
  #
  # Private:
  #   /metrics
  #   /readyz
  #
  # The API itself also keeps its internal endpoints available
  # to Docker-network clients.
  # ============================================================

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile

      args:
        VERSION: "${CALABA_VERSION:-dev}"
        COMMIT: "${CALABA_COMMIT:-unknown}"

    restart: unless-stopped

    <<: *hardening

    tmpfs:
      - /tmp

    environment:

      HTTP_ADDR: "0.0.0.0:3000"

      # --------------------------------------------------------
      # Public browser origins
      # --------------------------------------------------------

      PUBLIC_APP_URL: "https://${APP_HOST:-${DOMAIN}}"

      PUBLIC_APP_URL_ALT: "${DOMAIN_ALT:+https://${DOMAIN_ALT}}"

      PUBLIC_APP_URLS: "https://${APP_HOST:-${DOMAIN}}${DOMAIN_ALT:+,https://${DOMAIN_ALT}}${DOMAIN_LEGACY:+,https://${DOMAIN_LEGACY}}"


      # --------------------------------------------------------
      # Database / Valkey
      # --------------------------------------------------------

      DATABASE_URL: "postgres://calaba:${POSTGRES_PASSWORD:?}@calab-postgres:5432/calaba"

      REDIS_URL: "redis://:${REDIS_PASSWORD:?}@calab-valkey:6379"

      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-}"


      # --------------------------------------------------------
      # Auth
      # --------------------------------------------------------

      JWT_SECRET: "${JWT_SECRET:?}"

      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-24h}"

      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-8760h}"


      # --------------------------------------------------------
      # LiveKit
      # --------------------------------------------------------

      LIVEKIT_URL: "wss://rtc.${DOMAIN}"

      LIVEKIT_INTERNAL_URL: "http://calab-livekit:7880"

      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?}"

      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?}"


      # --------------------------------------------------------
      # File storage
      # --------------------------------------------------------

      STORAGE_DRIVER: "fs"

      STORAGE_PATH: "/data/files"

      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-50}"

      STORAGE_MAX_TOTAL_BYTES: "${STORAGE_MAX_TOTAL_BYTES:-53687091200}"


      # --------------------------------------------------------
      # Registration
      # --------------------------------------------------------

      REGISTRATION_MODE: "${REGISTRATION_MODE:-invite}"


      # --------------------------------------------------------
      # SMTP
      # --------------------------------------------------------

      SMTP_HOST: "${SMTP_HOST:-}"

      SMTP_PORT: "${SMTP_PORT:-465}"

      SMTP_TLS: "${SMTP_TLS:-tls}"

      SMTP_USER: "${SMTP_USER:-}"

      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"

      SMTP_FROM: "${SMTP_FROM:-}"


      # --------------------------------------------------------
      # Plans
      # --------------------------------------------------------

      PLAN_FREE_LIMITS: "${PLAN_FREE_LIMITS:-}"

      PLAN_TEAM_LIMITS: "${PLAN_TEAM_LIMITS:-}"

      PLAN_BUSINESS_LIMITS: "${PLAN_BUSINESS_LIMITS:-}"

      PLAN_CONTACT_URL: "${PLAN_CONTACT_URL:-}"

      PLAN_CONTACT_EMAIL: "${PLAN_CONTACT_EMAIL:-it@gptunnel.ai}"

      SUPERADMIN_EMAILS: "${SUPERADMIN_EMAILS:-}"


      # --------------------------------------------------------
      # Recording / GPTunneL
      # --------------------------------------------------------

      GPTUNNEL_API_URL: "${GPTUNNEL_API_URL:-https://gptunnel.ru}"

      GPTUNNEL_WEB_URL: "${GPTUNNEL_WEB_URL:-https://gptunnel.ru}"

      RECORDING_MAX_CONCURRENT: "${RECORDING_MAX_CONCURRENT:-3}"

      RECORDING_KEEP_DAYS: "${RECORDING_KEEP_DAYS:-30}"

      RECORDINGS_PATH: "/data/recordings"

      RECORDING_EGRESS_DIR: "/out"


      # --------------------------------------------------------
      # Bot API
      # --------------------------------------------------------

      BOT_RATE_PER_SEC: "${BOT_RATE_PER_SEC:-30}"

      BOT_MESSAGES_PER_MIN: "${BOT_MESSAGES_PER_MIN:-20}"

    volumes:
      - files_data:/data/files
      - recordings_data:/data/recordings

    deploy:
      resources:
        limits:
          memory: 1g

    healthcheck:
      test:
        - CMD
        - /server
        - healthcheck
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    depends_on:
      postgres:
        condition: service_healthy

      valkey:
        condition: service_healthy

      recordings-init:
        condition: service_completed_successfully

      livekit:
        condition: service_started

    networks:
      calab-internal:
        aliases:
          - calab-api

      dokploy-network:

    logging: *logging

    labels:

      traefik.enable: "true"
      traefik.docker.network: "dokploy-network"

      # --------------------------------------------------------
      # API router
      # --------------------------------------------------------

      traefik.http.routers.calab-api.rule: >-
        Host(`${APP_HOST:-${DOMAIN}}`) &&
        (
          PathPrefix(`/api`) ||
          PathPrefix(`/gateway`) ||
          Path(`/healthz`)
        )

      traefik.http.routers.calab-api.priority: "100"

      traefik.http.routers.calab-api.entrypoints: "websecure"

      traefik.http.routers.calab-api.tls: "true"

      traefik.http.routers.calab-api.tls.certresolver: "letsencrypt"

      traefik.http.routers.calab-api.middlewares: "crowdsec@file,calab-api-compress"

      traefik.http.routers.calab-api.service: "calab-api"

      traefik.http.services.calab-api.loadbalancer.server.port: "3000"


      # --------------------------------------------------------
      # Compression
      #
      # Traefik supports gzip / br / zstd.
      # This replaces Caddy's API JSON compression layer.
      # --------------------------------------------------------

      traefik.http.middlewares.calab-api-compress.compress: "true"

      traefik.http.middlewares.calab-api-compress.compress.minresponsebodybytes: "1024"


  # ============================================================
  # LIVEKIT
  #
  # Signal:
  #   rtc.<DOMAIN>:443/tcp -> 7880
  #
  # WebRTC:
  #   7881/tcp
  #   7882/udp
  #
  # TURN/TLS:
  #   turn.<DOMAIN>:443/tcp -> 5349
  #
  # TURN/UDP:
  #   443/udp
  #
  # TURN relay:
  #   20000-29999/udp
  # ============================================================

  livekit:
    image: livekit/livekit-server:v1.13@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 4g

    environment:

      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"

      REDIS_PASSWORD: "${REDIS_PASSWORD:?}"

      LIVEKIT_CONFIG: |
        port: 7880

        bind_addresses:
          - "0.0.0.0"

        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
          allow_tcp_fallback: true

        redis:
          address: calab-valkey:6379
          db: 1

        turn:
          enabled: true
          domain: turn.${DOMAIN}
          tls_port: 5349
          external_tls: true
          udp_port: 443
          relay_range_start: 20000
          relay_range_end: 29999

        room:
          auto_create: false
          empty_timeout: 300
          max_participants: 100

        audio:
          active_level: 40
          min_percentile: 40
          update_interval: 150
          smooth_intervals: 2

        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://calab-api:3000/api/rtc/webhook

        prometheus:
          port: 6789

        logging:
          level: info
          json: true

    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

      # TURN/UDP on 443.
      #
      # TCP/443 belongs to Traefik, UDP/443 belongs to LiveKit.
      - "443:443/udp"

      # TURN relay range.
      - "20000-29999:20000-29999/udp"

    depends_on:
      valkey:
        condition: service_healthy

    networks:
      calab-internal:
        aliases:
          - calab-livekit

      dokploy-network:

    logging: *logging

    labels:

      traefik.enable: "true"
      traefik.docker.network: "dokploy-network"


      # --------------------------------------------------------
      # LiveKit signaling / WebSocket
      # --------------------------------------------------------

      traefik.http.routers.calab-rtc.rule: "Host(`rtc.${DOMAIN}`)"

      traefik.http.routers.calab-rtc.entrypoints: "websecure"

      traefik.http.routers.calab-rtc.tls: "true"

      traefik.http.routers.calab-rtc.tls.certresolver: "letsencrypt"

      traefik.http.routers.calab-rtc.middlewares: "crowdsec@file"

      traefik.http.routers.calab-rtc.service: "calab-rtc"

      traefik.http.services.calab-rtc.loadbalancer.server.port: "7880"


      # --------------------------------------------------------
      # TURN/TLS
      #
      # Traefik terminates TLS and sends plain TURN TCP to
      # LiveKit :5349.
      # --------------------------------------------------------

      traefik.tcp.routers.calab-turn.rule: "HostSNI(`turn.${DOMAIN}`)"

      traefik.tcp.routers.calab-turn.entrypoints: "websecure"

      traefik.tcp.routers.calab-turn.tls: "true"

      traefik.tcp.routers.calab-turn.tls.certresolver: "letsencrypt"

      traefik.tcp.routers.calab-turn.service: "calab-turn"

      traefik.tcp.services.calab-turn.loadbalancer.server.port: "5349"


  # ============================================================
  # LIVEKIT EGRESS
  #
  # Restored from current main.
  #
  # Egress:
  #   - talks to LiveKit over Docker network
  #   - talks to Valkey DB 1
  #   - writes recordings to recordings_data
  #
  # It is intentionally NOT read-only because the image needs
  # writable runtime directories.
  # ============================================================

  egress:
    image: livekit/egress:v1.14.1@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    environment:

      EGRESS_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY}"
        api_secret: "${LIVEKIT_API_SECRET}"

        ws_url: ws://calab-livekit:7880

        insecure: true

        redis:
          address: calab-valkey:6379
          password: "${REDIS_PASSWORD}"
          db: 1

        template_port: 7980

        session_limits:
          file_output_max_duration: 3h59m

        logging:
          level: info
          json: true

    volumes:
      - recordings_data:/out

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g

    depends_on:
      valkey:
        condition: service_healthy

      recordings-init:
        condition: service_completed_successfully

      livekit:
        condition: service_started

    networks:
      calab-internal:

    logging: *logging


  # ============================================================
  # LIVEKIT SIP
  #
  # Current main feature.
  #
  # SIP:
  #   5060/tcp
  #   5060/udp
  #
  # RTP:
  #   10000-10200/udp
  #
  # SIP is enabled through the Compose profile:
  #
  #   SIP_ENABLED=1
  #
  # In Dokploy this must be accompanied by:
  #
  #   COMPOSE_PROFILES=sip
  #
  # in the environment.
  # ============================================================

  sip:
    image: livekit/sip:v1.14.0@sha256:1487f39ca985f64879cc74b045e1ddc22f7afdb02e8a4739d92d749b9c3c3ad2

    profiles:
      - sip

    restart: unless-stopped

    <<: *hardening

    tmpfs:
      - /tmp

    environment:

      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"

      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"

      SIP_CONFIG_BODY: |
        ws_url: ws://calab-livekit:7880

        redis:
          address: calab-valkey:6379
          db: 1
          password: "${REDIS_PASSWORD}"

        sip_port: 5060

        rtp_port: 10000-10200

        use_external_ip: true

        hide_inbound_port: true

        logging:
          level: info
          json: true

    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "10000-10200:10000-10200/udp"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m

    depends_on:
      valkey:
        condition: service_healthy

      livekit:
        condition: service_started

    networks:
      calab-internal:

    logging: *logging


  # ============================================================
  # RECORDINGS INIT
  #
  # Makes recordings_data writable by:
  #   API UID 65532
  #
  # The egress container then creates its per-workspace
  # recording directories.
  # ============================================================

  recordings-init:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11

    network_mode: none

    restart: "no"

    user: "0:0"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - FOWNER

    entrypoint:
      - sh
      - -c
      - "chmod 0755 /out && chown 65532:65532 /out"

    volumes:
      - recordings_data:/out

    logging: *logging


  # ============================================================
  # POSTGRES
  # ============================================================

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

    restart: unless-stopped

    <<: *hardening

    user: "70:70"

    tmpfs:
      - /tmp

      - /var/run/postgresql:uid=70,gid=70,mode=2775

    environment:

      POSTGRES_USER: "calaba"

      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"

      POSTGRES_DB: "calaba"

    volumes:
      - pg_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U calaba
      interval: 5s
      timeout: 3s
      retries: 10

    deploy:
      resources:
        limits:
          memory: 2g

    networks:
      calab-internal:
        aliases:
          - calab-postgres

    logging: *logging


  # ============================================================
  # VALKEY
  # ============================================================

  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11

    restart: unless-stopped

    <<: *hardening

    user: "999:1000"

    tmpfs:
      - /tmp

    environment:

      REDIS_PASSWORD: "${REDIS_PASSWORD:?}"

    command:
      - sh
      - -c
      - |
        umask 077

        pw=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')

        printf 'requirepass "%s"\n' "$$pw" > /tmp/auth.conf

        exec valkey-server /tmp/auth.conf \
          --save 60 1 \
          --appendonly yes \
          --maxmemory 512mb \
          --maxmemory-policy noeviction

    volumes:
      - valkey_data:/data

    deploy:
      resources:
        limits:
          memory: 768m

    healthcheck:
      test:
        - CMD-SHELL
        - 'VALKEYCLI_AUTH="$$REDIS_PASSWORD" valkey-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      calab-internal:
        aliases:
          - calab-valkey

    logging: *logging


# ==============================================================
# NETWORKS
# ==============================================================

networks:

  # Existing Dokploy network.
  #
  # MUST already exist on the Dokploy host.
  dokploy-network:
    external: true

  # Private application network.
  calab-internal:
    driver: bridge


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  pg_data:

  valkey_data:

  files_data:

  recordings_data:

  # Desktop release artifacts when S3_PUBLIC_URL is empty.
  releases_data:
