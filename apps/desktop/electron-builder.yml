# Packaging config. Signing/notarization come in stage 4 (docs/07-roadmap.md);
# certificates are provided via env (CSC_LINK, APPLE_ID, ...), never committed.
appId: app.calaba.desktop
productName: Calaba
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # uiohook-napi must be our patched build (Caps Lock, mouse 3–5 release; patches/uiohook-napi@*.patch),
  # compiled per arch below — never the upstream prebuilt binaries it ships.
  - '!**/node_modules/uiohook-napi/prebuilds/**'
asarUnpack:
  - '**/*.node'
# Owner artwork (scripts/gen-icons.sh). Tray + Linux window icons are loaded by main at runtime.
extraResources:
  - from: build/icons/tray
    to: icons/tray
  - from: build/icons/linux/512x512.png
    to: icons/window.png
npmRebuild: true
# Compile native deps from source for every target arch (x64 is cross-compiled on Apple Silicon),
# so the packaged uiohook_napi.node is the patched build/Release of that arch.
buildDependenciesFromSource: true
protocols:
  - name: Calaba
    schemes: [calaba]
mac:
  icon: build/icons/mac/icon.icns
  category: public.app-category.business
  # Apple Silicon and Intel as separate artifacts (the update feed serves the matching one).
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned until the Developer ID arrives (stage 4); CSC_LINK in env enables signing.
  identity: null
  # Stage 4: notarization (needs APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID in env).
  # notarize: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Calaba использует микрофон для голосовых комнат.
    NSAudioCaptureUsageDescription: Calaba захватывает системный звук при показе экрана.
    NSAppleEventsUsageDescription: Calaba открывает системные настройки разрешений.
win:
  icon: build/icons/win/icon.png
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
linux:
  icon: build/icons/linux
  target: [AppImage, deb]
  category: Network
  maintainer: Calaba
